# brain.yaml — your second brain's settings.
# Created by /onboard. Lives in brain/ (git-ignored): it never reaches the shared repo.
# brain/ is its own private git repo (D26): every skill that writes here makes one commit.
# Edit by hand any time, or re-run /onboard to add a product.

# Who you are
owner:
  name: ""                  # e.g. Ana Souza
  role: pm                  # pm | manager — changes skill defaults only (D18)

# Your products (D14). Add one entry per product; /onboard does this for you.
products: []
#  - name: Listings Optimizer          # display name
#    slug: listings-optimizer          # folder name: brain/products/<slug>/
#    jira_keys: [LOPT]                 # Jira project key(s)
#    confluence_spaces: [LOPT]         # Confluence space key(s) or URLs
#    release_notes_persona: "Marketplace sellers who manage 50+ listings"
#    # Full persona: brain/preferences/persona.md (overrides templates/persona.md)

# Main stakeholders — details live in brain/stakeholders/<firstname-lastname>.md
stakeholders: []
#  - name: Marco Lima
#    role: Engineering Manager
#    file: stakeholders/marco-lima.md

# Team hub (optional, D19). Local clone of the shared pm-team-hub repo. Empty path = team features off.
team_hub:
  path: ""                  # relative to the pm-agents folder (not brain/), e.g. ../pm-team-hub
  person_slug: ""           # your file name in the hub, e.g. ana-souza (members/ana-souza.md)

# Defaults used by skills
defaults:
  timezone: ""              # e.g. America/Sao_Paulo (used for weekly-status periods)
  week_starts_on: monday
