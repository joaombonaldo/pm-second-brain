<!DOCTYPE html>
<!--
  Team default release-notes template (pm-agents).
  Personal override: brain/preferences/release-notes.html (D10).
  Placeholders replaced by /release-notes:
    {{product_name}}  {{version}}  {{date}}  {{intro}}  {{sections}}
  {{sections}} = one <section> per theme, like this:
    <section>
      <h2>Faster bulk editing</h2>
      <ul>
        <li data-jira="LOPT-101"><strong>Edit many titles at once.</strong> You can now ...</li>
      </ul>
    </section>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{product_name}} {{version}} — Release notes</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2328;
    --muted: #59636e;
    --line: #d8dee4;
    --accent: #2f5d8a;
    --card: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191d;
      --text: #e6e8eb;
      --muted: #9aa4ae;
      --line: #30363d;
      --accent: #8ab4dc;
      --card: #1e2227;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px 64px; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 24px; margin-bottom: 32px; }
  .eyebrow { color: var(--muted); font-size: 14px; letter-spacing: .02em; margin: 0 0 6px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 12px; }
  .intro { font-size: 18px; color: var(--text); margin: 0; }
  section { margin: 0 0 32px; }
  h2 {
    font-size: 19px; margin: 0 0 12px; padding-left: 12px;
    border-left: 3px solid var(--accent);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin: 0 0 10px;
  }
  li strong { display: block; margin-bottom: 2px; }
  footer { border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Release notes · {{date}}</p>
    <h1>{{product_name}} {{version}}</h1>
    <p class="intro">{{intro}}</p>
  </header>

  {{sections}}

  <footer>
    Questions or feedback? Reply to the message you received this in.
  </footer>
</main>
</body>
</html>
